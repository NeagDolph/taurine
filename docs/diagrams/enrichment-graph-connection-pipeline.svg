<svg viewBox="0 0 720 1150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2t d2d">
<title id="d2t">Enrichment and graph connection pipeline</title>
<desc id="d2d">Connector sources are extracted and diffed, enriched in similarity-clustered GLM batches with the user card as context, embedded with Qwen3, then connected by a cheap graph build (synonym-resolved shared terms plus semantic kNN) and refined by deepseek margin adjudication that writes facts onto edges.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .th{font-size:13px;font-weight:600;fill:#2C2C2A}
  .ts{font-size:11px;font-weight:400;fill:#73726c}
  .arr{stroke:#73726c;stroke-width:1.5;fill:none}
  rect{stroke-width:.5}
  .c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
  .node.c-gray rect{fill:#D3D1C7}
  .c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#444441}
  .c-blue rect{fill:#E6F1FB;stroke:#185FA5}
  .node.c-blue rect{fill:#B5D4F4}
  .c-blue .th{fill:#042C53}.c-blue .ts{fill:#0C447C}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7}
  .node.c-purple rect{fill:#CECBF6}
  .c-purple .th{fill:#26215C}.c-purple .ts{fill:#3C3489}
  .c-amber rect{fill:#FAEEDA;stroke:#854F0B}
  .node.c-amber rect{fill:#FAC775}
  .c-amber .th{fill:#412402}.c-amber .ts{fill:#633806}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
  .node.c-teal rect{fill:#9FE1CB}
  .c-teal .th{fill:#04342C}.c-teal .ts{fill:#085041}
  .c-green rect{fill:#EAF3DE;stroke:#3B6D11}
  .node.c-green rect{fill:#C0DD97}
  .c-green .th{fill:#173404}.c-green .ts{fill:#27500A}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="1" y="1" width="718" height="1148" rx="16" fill="#FBFAF7" stroke="#E8E6DF"/>
<text class="ts" x="360" y="16" text-anchor="middle" dominant-baseline="central">gray = sources · amber = LLM · blue = local models · purple = graph build</text>
<g class="node c-gray">
  <rect x="20" y="34" width="155" height="56" rx="8"/>
  <text class="th" x="97" y="52" text-anchor="middle" dominant-baseline="central">Apple Notes</text>
  <text class="ts" x="97" y="70" text-anchor="middle" dominant-baseline="central">notes + folders</text>
</g>
<g class="node c-gray">
  <rect x="188" y="34" width="155" height="56" rx="8"/>
  <text class="th" x="265" y="52" text-anchor="middle" dominant-baseline="central">iMessage</text>
  <text class="ts" x="265" y="70" text-anchor="middle" dominant-baseline="central">+ Contacts names</text>
</g>
<g class="node c-gray">
  <rect x="356" y="34" width="155" height="56" rx="8"/>
  <text class="th" x="433" y="52" text-anchor="middle" dominant-baseline="central">Obsidian</text>
  <text class="ts" x="433" y="70" text-anchor="middle" dominant-baseline="central">vault markdown</text>
</g>
<g class="node c-gray">
  <rect x="524" y="34" width="155" height="56" rx="8"/>
  <text class="th" x="601" y="52" text-anchor="middle" dominant-baseline="central">Memories</text>
  <text class="ts" x="601" y="70" text-anchor="middle" dominant-baseline="central">Claude + Codex</text>
</g>
<line x1="97" y1="90" x2="245" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="265" y1="90" x2="322" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="433" y1="90" x2="398" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="601" y1="90" x2="472" y2="138" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue">
  <rect x="210" y="142" width="300" height="56" rx="8"/>
  <text class="th" x="360" y="160" text-anchor="middle" dominant-baseline="central">Extract + hash diff</text>
  <text class="ts" x="360" y="178" text-anchor="middle" dominant-baseline="central">changed notes only · cache by content</text>
</g>
<line x1="360" y1="198" x2="360" y2="238" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber">
  <rect x="20" y="252" width="170" height="88" rx="8"/>
  <text class="th" x="105" y="274" text-anchor="middle" dominant-baseline="central">User card</text>
  <text class="ts" x="105" y="294" text-anchor="middle" dominant-baseline="central">GLM-5.2 · full corpus</text>
  <text class="ts" x="105" y="312" text-anchor="middle" dominant-baseline="central">context for all prompts</text>
</g>
<line x1="192" y1="296" x2="206" y2="296" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber">
  <rect x="210" y="242" width="470" height="200" rx="20"/>
  <text class="th" x="445" y="266" text-anchor="middle" dominant-baseline="central">Batched enrichment — GLM-5.2</text>
</g>
<g class="node c-blue">
  <rect x="232" y="286" width="205" height="88" rx="8"/>
  <text class="th" x="334" y="308" text-anchor="middle" dominant-baseline="central">Similarity clusters</text>
  <text class="ts" x="334" y="328" text-anchor="middle" dominant-baseline="central">embed title + head</text>
  <text class="ts" x="334" y="346" text-anchor="middle" dominant-baseline="central">≤10 notes · ≤24k chars</text>
</g>
<line x1="439" y1="330" x2="456" y2="330" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber">
  <rect x="460" y="286" width="198" height="88" rx="8"/>
  <text class="th" x="559" y="308" text-anchor="middle" dominant-baseline="central">One call per batch</text>
  <text class="ts" x="559" y="328" text-anchor="middle" dominant-baseline="central">keyed by note_id</text>
  <text class="ts" x="559" y="346" text-anchor="middle" dominant-baseline="central">no blending · validated</text>
</g>
<text class="ts" x="445" y="412" text-anchor="middle" dominant-baseline="central">missing ids fall back to per-note calls</text>
<line x1="360" y1="442" x2="250" y2="482" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="442" x2="510" y2="482" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue">
  <rect x="110" y="486" width="240" height="56" rx="8"/>
  <text class="th" x="230" y="504" text-anchor="middle" dominant-baseline="central">Enriched note</text>
  <text class="ts" x="230" y="522" text-anchor="middle" dominant-baseline="central">gist · aliases · topics · entities</text>
</g>
<g class="node c-blue">
  <rect x="390" y="486" width="230" height="56" rx="8"/>
  <text class="th" x="505" y="504" text-anchor="middle" dominant-baseline="central">Qwen3-0.6B embeds</text>
  <text class="ts" x="505" y="522" text-anchor="middle" dominant-baseline="central">chunks + gist + utterances</text>
</g>
<line x1="230" y1="542" x2="230" y2="588" class="arr" marker-end="url(#arrow)"/>
<line x1="505" y1="542" x2="505" y2="588" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple">
  <rect x="20" y="594" width="660" height="200" rx="20"/>
  <text class="th" x="350" y="618" text-anchor="middle" dominant-baseline="central">Cheap graph build — no LLM</text>
</g>
<g class="node c-blue">
  <rect x="45" y="642" width="195" height="88" rx="8"/>
  <text class="th" x="142" y="664" text-anchor="middle" dominant-baseline="central">Term resolution</text>
  <text class="ts" x="142" y="684" text-anchor="middle" dominant-baseline="central">synonym clusters ≥ 0.95</text>
  <text class="ts" x="142" y="702" text-anchor="middle" dominant-baseline="central">digit + lexical guards</text>
</g>
<g class="node c-blue">
  <rect x="262" y="642" width="190" height="88" rx="8"/>
  <text class="th" x="357" y="664" text-anchor="middle" dominant-baseline="central">Semantic edges</text>
  <text class="ts" x="357" y="684" text-anchor="middle" dominant-baseline="central">gist kNN top-6</text>
  <text class="ts" x="357" y="702" text-anchor="middle" dominant-baseline="central">cosine ≥ 0.55</text>
</g>
<g class="node c-blue">
  <rect x="474" y="642" width="185" height="88" rx="8"/>
  <text class="th" x="566" y="664" text-anchor="middle" dominant-baseline="central">Shared-term edges</text>
  <text class="ts" x="566" y="684" text-anchor="middle" dominant-baseline="central">canonical intersect</text>
  <text class="ts" x="566" y="702" text-anchor="middle" dominant-baseline="central">rarity-weighted ≥ 0.25</text>
</g>
<path d="M142 732 L142 744 L566 744 L566 734" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="770" text-anchor="middle" dominant-baseline="central">noisy-or merge per pair · degree cap 12</text>
<line x1="350" y1="794" x2="350" y2="842" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber">
  <rect x="20" y="846" width="660" height="196" rx="20"/>
  <text class="th" x="350" y="870" text-anchor="middle" dominant-baseline="central">Margin adjudication — deepseek-v4-pro</text>
</g>
<g class="node c-blue">
  <rect x="45" y="894" width="200" height="100" rx="8"/>
  <text class="th" x="145" y="914" text-anchor="middle" dominant-baseline="central">Bands</text>
  <text class="ts" x="145" y="936" text-anchor="middle" dominant-baseline="central">strong → facts (top 6)</text>
  <text class="ts" x="145" y="954" text-anchor="middle" dominant-baseline="central">weak → vetoable</text>
  <text class="ts" x="145" y="972" text-anchor="middle" dominant-baseline="central">margin → admit or reject</text>
</g>
<line x1="247" y1="944" x2="266" y2="944" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber">
  <rect x="270" y="894" width="195" height="100" rx="8"/>
  <text class="th" x="367" y="914" text-anchor="middle" dominant-baseline="central">Batched judging</text>
  <text class="ts" x="367" y="936" text-anchor="middle" dominant-baseline="central">20 pairs per call</text>
  <text class="ts" x="367" y="954" text-anchor="middle" dominant-baseline="central">user card as context</text>
  <text class="ts" x="367" y="972" text-anchor="middle" dominant-baseline="central">one-sentence facts</text>
</g>
<line x1="467" y1="944" x2="486" y2="944" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue">
  <rect x="490" y="894" width="170" height="100" rx="8"/>
  <text class="th" x="575" y="914" text-anchor="middle" dominant-baseline="central">Judgment cache</text>
  <text class="ts" x="575" y="936" text-anchor="middle" dominant-baseline="central">content-hash signed</text>
  <text class="ts" x="575" y="954" text-anchor="middle" dominant-baseline="central">rebuilds apply free</text>
  <text class="ts" x="575" y="972" text-anchor="middle" dominant-baseline="central">invalid on note edit</text>
</g>
<line x1="350" y1="1042" x2="350" y2="1074" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green">
  <rect x="210" y="1078" width="300" height="56" rx="8"/>
  <text class="th" x="360" y="1096" text-anchor="middle" dominant-baseline="central">Graph with facts</text>
  <text class="ts" x="360" y="1114" text-anchor="middle" dominant-baseline="central">map · previews · retrieval graph-vote</text>
</g>
</svg>
