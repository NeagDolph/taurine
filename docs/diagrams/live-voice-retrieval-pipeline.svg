<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-first live voice retrieval pipeline</title>
  <desc id="desc">Final transcript chunks receive stable T identifiers. Partials are query-only. A time-aware window enters calibrated dense, BM25, exact entity, GLiNER entity, and query-to-triple heads. Explicit abstention gates PPR over the passage entity fact base graph. Exact source passages are reranked, diversified, registered, validated with NLI, and supplied to a sequence-safe rolling summary.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:white;stroke:#cbd5e1;stroke-width:1.5;rx:12}.blue{fill:#eff6ff;stroke:#60a5fa}.violet{fill:#f5f3ff;stroke:#8b5cf6}.green{fill:#ecfdf5;stroke:#34d399}.amber{fill:#fffbeb;stroke:#f59e0b}.title{font:600 17px system-ui;fill:#0f172a}.text{font:13px system-ui;fill:#334155}.small{font:11px system-ui;fill:#64748b}.line{stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="720" height="1080"/>
  <text class="title" x="360" y="36" text-anchor="middle">Live voice → calibrated evidence → validated summary</text>

  <rect class="box" x="170" y="65" width="380" height="70"/><text class="title" x="360" y="92" text-anchor="middle">ASR transcript ledger</text><text class="text" x="360" y="116" text-anchor="middle">finals = stable T# · partials = query-only</text>
  <path class="line" d="M360 135V170"/>
  <rect class="box blue" x="120" y="170" width="480" height="88"/><text class="title" x="360" y="198" text-anchor="middle">12–45 second retrieval window</text><text class="text" x="360" y="222" text-anchor="middle">≥3 finals · ≤6000 chars · 2 preceding context chunks</text><text class="small" x="360" y="243" text-anchor="middle">active partials cannot become citations</text>
  <path class="line" d="M360 258V292"/>
  <rect class="box blue" x="65" y="292" width="590" height="118"/><text class="title" x="360" y="320" text-anchor="middle">Independent calibrated recall heads</text><text class="text" x="360" y="348" text-anchor="middle">whole-corpus dense · passage BM25 · exact alias once</text><text class="text" x="360" y="372" text-anchor="middle">GLiNER2 typed entity resolution · query-to-triple recognition</text><text class="small" x="360" y="395" text-anchor="middle">raw and rejected scores remain in RetrievalTrace</text>
  <path class="line" d="M360 410V445"/>
  <rect class="box amber" x="185" y="445" width="350" height="66"/><text class="title" x="360" y="472" text-anchor="middle">Pre-PPR abstention</text><text class="text" x="360" y="495" text-anchor="middle">independent-head agreement or calibrated override</text>
  <path class="line" d="M360 511V546"/>
  <rect class="box violet" x="90" y="546" width="540" height="102"/><text class="title" x="360" y="574" text-anchor="middle">Typed PPR on the base graph</text><text class="text" x="360" y="600" text-anchor="middle">passage + entity + recognized-triple endpoint reset</text><text class="text" x="360" y="624" text-anchor="middle">directed temporal facts · provenance paths ≤4 hops</text>
  <path class="line" d="M360 648V683"/>
  <rect class="box blue" x="90" y="683" width="540" height="102"/><text class="title" x="360" y="711" text-anchor="middle">Local Qwen passage rerank + MMR</text><text class="text" x="360" y="737" text-anchor="middle">source passages, path support, ≤2 passages per note</text><text class="text" x="360" y="761" text-anchor="middle">source diversity · post-rerank abstention</text>
  <path class="line" d="M360 785V820"/>
  <rect class="box green" x="70" y="820" width="580" height="92"/><text class="title" x="360" y="848" text-anchor="middle">EvidencePack + shared registry</text><text class="text" x="360" y="874" text-anchor="middle">exact passages E# · facts F# · paths P# · notes N#</text><text class="small" x="360" y="896" text-anchor="middle">retrieved → read → cited; no identifier reuse</text>
  <path class="line" d="M360 912V947"/>
  <rect class="box amber" x="85" y="947" width="550" height="92"/><text class="title" x="360" y="975" text-anchor="middle">One summary pass + DeBERTa NLI</text><text class="text" x="360" y="1001" text-anchor="middle">every factual sentence cites T/E/F · fail closed without NLI</text><text class="small" x="360" y="1023" text-anchor="middle">checkpoint advances only after validated acceptance</text>
</svg>
