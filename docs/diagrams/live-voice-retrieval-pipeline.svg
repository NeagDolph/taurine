<svg viewBox="0 0 720 1090" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1t d1d">
<title id="d1t">Live voice retrieval pipeline</title>
<desc id="d1d">Mic audio flows through Deepgram into transcript chunks, which feed the C1 exact collector and the C2 retrieval window; C2 fans into four query heads fused by RRF, expanded through graph space, reranked and protected into the slate; the cadence gate and presenter turn the slate into pinned cards.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .th{font-size:13px;font-weight:600;fill:#2C2C2A}
  .ts{font-size:11px;font-weight:400;fill:#73726c}
  .arr{stroke:#73726c;stroke-width:1.5;fill:none}
  rect{stroke-width:.5}
  .c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
  .node.c-gray rect{fill:#D3D1C7}
  .c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#444441}
  .c-blue rect{fill:#E6F1FB;stroke:#185FA5}
  .node.c-blue rect{fill:#B5D4F4}
  .c-blue .th{fill:#042C53}.c-blue .ts{fill:#0C447C}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7}
  .node.c-purple rect{fill:#CECBF6}
  .c-purple .th{fill:#26215C}.c-purple .ts{fill:#3C3489}
  .c-amber rect{fill:#FAEEDA;stroke:#854F0B}
  .node.c-amber rect{fill:#FAC775}
  .c-amber .th{fill:#412402}.c-amber .ts{fill:#633806}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
  .node.c-teal rect{fill:#9FE1CB}
  .c-teal .th{fill:#04342C}.c-teal .ts{fill:#085041}
  .c-green rect{fill:#EAF3DE;stroke:#3B6D11}
  .node.c-green rect{fill:#C0DD97}
  .c-green .th{fill:#173404}.c-green .ts{fill:#27500A}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="1" y="1" width="718" height="1088" rx="16" fill="#FBFAF7" stroke="#E8E6DF"/>
<text class="ts" x="360" y="16" text-anchor="middle" dominant-baseline="central">blue = retrieval · purple = graph space · amber = LLM · teal = slate state</text>
<g class="node c-gray">
  <rect x="20" y="34" width="160" height="56" rx="8"/>
  <text class="th" x="100" y="52" text-anchor="middle" dominant-baseline="central">Mic capture</text>
  <text class="ts" x="100" y="70" text-anchor="middle" dominant-baseline="central">16 kHz PCM</text>
</g>
<line x1="182" y1="62" x2="221" y2="62" class="arr" marker-end="url(#arrow)"/>
<g class="node c-gray">
  <rect x="225" y="34" width="180" height="56" rx="8"/>
  <text class="th" x="315" y="52" text-anchor="middle" dominant-baseline="central">Deepgram nova-3</text>
  <text class="ts" x="315" y="70" text-anchor="middle" dominant-baseline="central">streaming ASR</text>
</g>
<line x1="407" y1="62" x2="446" y2="62" class="arr" marker-end="url(#arrow)"/>
<g class="node c-gray">
  <rect x="450" y="34" width="230" height="56" rx="8"/>
  <text class="th" x="565" y="52" text-anchor="middle" dominant-baseline="central">Transcript chunks</text>
  <text class="ts" x="565" y="70" text-anchor="middle" dominant-baseline="central">partials + finals, seq'd</text>
</g>
<path d="M480 90 L480 128 L125 128 L125 164" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M565 90 L565 128 L485 128 L485 164" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue">
  <rect x="20" y="168" width="210" height="56" rx="8"/>
  <text class="th" x="125" y="186" text-anchor="middle" dominant-baseline="central">C1 exact collector</text>
  <text class="ts" x="125" y="204" text-anchor="middle" dominant-baseline="central">word-boundary alias hits</text>
</g>
<g class="node c-blue">
  <rect x="330" y="168" width="310" height="56" rx="8"/>
  <text class="th" x="485" y="186" text-anchor="middle" dominant-baseline="central">C2 window</text>
  <text class="ts" x="485" y="204" text-anchor="middle" dominant-baseline="central">3 chunks + 2-chunk buffer · 8 s throttle</text>
</g>
<line x1="485" y1="226" x2="295" y2="268" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="226" x2="413" y2="268" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="226" x2="529" y2="268" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="226" x2="645" y2="268" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue">
  <rect x="240" y="272" width="106" height="56" rx="8"/>
  <text class="th" x="293" y="290" text-anchor="middle" dominant-baseline="central">Dense</text>
  <text class="ts" x="293" y="308" text-anchor="middle" dominant-baseline="central">window text</text>
</g>
<g class="node c-blue">
  <rect x="358" y="272" width="106" height="56" rx="8"/>
  <text class="th" x="411" y="290" text-anchor="middle" dominant-baseline="central">Salient</text>
  <text class="ts" x="411" y="308" text-anchor="middle" dominant-baseline="central">rare terms</text>
</g>
<g class="node c-blue">
  <rect x="476" y="272" width="106" height="56" rx="8"/>
  <text class="th" x="529" y="290" text-anchor="middle" dominant-baseline="central">GLiNER2</text>
  <text class="ts" x="529" y="308" text-anchor="middle" dominant-baseline="central">spans + context</text>
</g>
<g class="node c-blue">
  <rect x="594" y="272" width="106" height="56" rx="8"/>
  <text class="th" x="647" y="290" text-anchor="middle" dominant-baseline="central">BM25</text>
  <text class="ts" x="647" y="308" text-anchor="middle" dominant-baseline="central">+ snapped terms</text>
</g>
<line x1="293" y1="330" x2="380" y2="372" class="arr" marker-end="url(#arrow)"/>
<line x1="411" y1="330" x2="440" y2="372" class="arr" marker-end="url(#arrow)"/>
<line x1="529" y1="330" x2="540" y2="372" class="arr" marker-end="url(#arrow)"/>
<line x1="647" y1="330" x2="605" y2="372" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
  <rect x="330" y="376" width="310" height="56" rx="8"/>
  <text class="th" x="485" y="394" text-anchor="middle" dominant-baseline="central">RRF fusion</text>
  <text class="ts" x="485" y="412" text-anchor="middle" dominant-baseline="central">5 ranked lists · k = 60</text>
</g>
<line x1="485" y1="434" x2="485" y2="476" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple">
  <rect x="240" y="480" width="440" height="158" rx="20"/>
  <text class="th" x="460" y="504" text-anchor="middle" dominant-baseline="central">Graph space</text>
</g>
<g class="node c-blue">
  <rect x="262" y="524" width="190" height="88" rx="8"/>
  <text class="th" x="357" y="546" text-anchor="middle" dominant-baseline="central">Graph vote</text>
  <text class="ts" x="357" y="566" text-anchor="middle" dominant-baseline="central">neighbors of top-10</text>
  <text class="ts" x="357" y="584" text-anchor="middle" dominant-baseline="central">feeds 5th RRF list ↻</text>
</g>
<g class="node c-blue">
  <rect x="472" y="524" width="186" height="88" rx="8"/>
  <text class="th" x="565" y="546" text-anchor="middle" dominant-baseline="central">1-hop expansion</text>
  <text class="ts" x="565" y="566" text-anchor="middle" dominant-baseline="central">top-5 seed neighbors</text>
  <text class="ts" x="565" y="584" text-anchor="middle" dominant-baseline="central">edge weight × 0.5</text>
</g>
<path d="M460 638 L460 662 L335 662 L335 686" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber">
  <rect x="240" y="690" width="190" height="56" rx="8"/>
  <text class="th" x="335" y="708" text-anchor="middle" dominant-baseline="central">Cohere rerank</text>
  <text class="ts" x="335" y="726" text-anchor="middle" dominant-baseline="central">rerank-v3.5 · top 20</text>
</g>
<line x1="432" y1="718" x2="476" y2="718" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue">
  <rect x="480" y="690" width="200" height="56" rx="8"/>
  <text class="th" x="580" y="708" text-anchor="middle" dominant-baseline="central">Protect + floor</text>
  <text class="ts" x="580" y="726" text-anchor="middle" dominant-baseline="central">fused 3 · dense 2 · top 8</text>
</g>
<path d="M125 226 L125 836" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M580 748 L580 772 L510 772 L510 836" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
  <rect x="20" y="798" width="660" height="168" rx="20"/>
  <text class="th" x="350" y="820" text-anchor="middle" dominant-baseline="central">Slate</text>
</g>
<g class="node c-teal">
  <rect x="45" y="840" width="290" height="100" rx="8"/>
  <text class="th" x="190" y="862" text-anchor="middle" dominant-baseline="central">Exact lane</text>
  <text class="ts" x="190" y="884" text-anchor="middle" dominant-baseline="central">quota 3 · decay 2 revs</text>
  <text class="ts" x="190" y="902" text-anchor="middle" dominant-baseline="central">never re-show · suppress 300 s</text>
</g>
<g class="node c-teal">
  <rect x="365" y="840" width="290" height="100" rx="8"/>
  <text class="th" x="510" y="862" text-anchor="middle" dominant-baseline="central">Search lane</text>
  <text class="ts" x="510" y="884" text-anchor="middle" dominant-baseline="central">quota 8 · C2 top-8 adds</text>
  <text class="ts" x="510" y="902" text-anchor="middle" dominant-baseline="central">evict: views ↓ · score ↓ · oldest</text>
</g>
<line x1="190" y1="966" x2="190" y2="1002" class="arr" marker-end="url(#arrow)"/>
<g class="node c-gray">
  <rect x="95" y="1006" width="190" height="56" rx="8"/>
  <text class="th" x="190" y="1024" text-anchor="middle" dominant-baseline="central">Cadence gate</text>
  <text class="ts" x="190" y="1042" text-anchor="middle" dominant-baseline="central">3 s debounce · ≤3/min</text>
</g>
<line x1="287" y1="1034" x2="326" y2="1034" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber">
  <rect x="330" y="1006" width="210" height="56" rx="8"/>
  <text class="th" x="435" y="1024" text-anchor="middle" dominant-baseline="central">Presenter</text>
  <text class="ts" x="435" y="1042" text-anchor="middle" dominant-baseline="central">whole transcript · read_note</text>
</g>
<line x1="542" y1="1034" x2="571" y2="1034" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green">
  <rect x="575" y="1006" width="125" height="56" rx="8"/>
  <text class="th" x="637" y="1024" text-anchor="middle" dominant-baseline="central">Pins + why</text>
  <text class="ts" x="637" y="1042" text-anchor="middle" dominant-baseline="central">max 3 cards</text>
</g>
</svg>
